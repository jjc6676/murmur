name: Murmur
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    # Swift 5.9+ compiler, Swift 5 language mode (5.9 is not a language mode).
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'

targets:
  MurmurCore:
    type: framework
    platform: iOS
    sources: [MurmurCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjc6676.murmur.core
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: libsqlite3.tbd

  MurmurCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MurmurCoreTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjc6676.murmur.coretests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: iphonesimulator
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @loader_path/Frameworks'
    dependencies:
      - target: MurmurCore
        embed: true

  MurmurKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: MurmurKeyboard
        excludes: [Info.plist, MurmurKeyboard.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjc6676.murmur.keyboard
        INFOPLIST_FILE: MurmurKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: MurmurKeyboard/MurmurKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../../Frameworks'
    dependencies:
      - target: MurmurCore
        embed: false

  Murmur:
    type: application
    platform: iOS
    sources:
      - path: Murmur
        excludes: [Info.plist, Murmur.entitlements]
      - path: Resources/ggml-base.en.bin
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjc6676.murmur
        INFOPLIST_FILE: Murmur/Info.plist
        CODE_SIGN_ENTITLEMENTS: Murmur/Murmur.entitlements
    dependencies:
      - target: MurmurCore
        embed: true
      - framework: Frameworks/whisper.xcframework
        embed: true
        codeSign: true
      - target: MurmurKeyboard
        embed: true
        link: false

schemes:
  MurmurCoreTests:
    build:
      targets:
        MurmurCoreTests: [test]
    test:
      targets: [MurmurCoreTests]
  Murmur:
    build:
      targets:
        Murmur: all
